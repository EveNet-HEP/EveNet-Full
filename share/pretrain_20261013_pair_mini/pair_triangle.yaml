platform:
  default: platform.yaml
logger:
  wandb:
    project: Pretrain-Pair-Representation
    entity: ytchou97-university-of-washington
    run_name: mini-1pct-pair_triangle
    tags:
    - Pretrain
    - Mini
    - 1pct
    - Pair-Ablation
    - '20261013'
    simplified: false
  local:
    save_dir: /pscratch/sd/t/tihsu/database/Pretrain-PairRepresentation/mini-1pct-20261013-16gpu-30ep/logs
    name: mini-1pct-pair_triangle
    version: train
options:
  default: options.yaml
  Training:
    model_checkpoint_save_path: /pscratch/sd/t/tihsu/database/Pretrain-PairRepresentation/mini-1pct-20261013-16gpu-30ep/checkpoints/pair_triangle
    Components:
      PairContrastive:
        include: false
  Metrics:
    PairRepresentation:
      enabled: true
    PairContrastive:
      enabled: false
network:
  default: ../network/network-mini.yaml
  Classification:
    use_pair_representation: true
  Body:
    PairCreator:
      create:
      - logDeltaR
      - logMass
      - logKT
      - logPTRatio
    PET:
      attention_bias_type: IterativeUpdate
      use_object_to_pair: true
      use_triangle_attention: true
      use_triangle_multiplication: true
event_info:
  default: ../event_info/multi_process.yaml
resonance:
  default: ../resonance/standard_model.yaml
process_info:
  default: ../process_info/pretrain.yaml
